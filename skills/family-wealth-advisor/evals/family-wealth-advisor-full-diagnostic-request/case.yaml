schema_version: "1.1"
name: family-wealth-advisor-full-diagnostic-request
expected_outcome: |
  A structured Private Wealth Diagnostic covering all 10 framework sections (net worth, cash flow,
  emergency fund, debt, insurance audit, investment allocation, retirement readiness, tax efficiency,
  estate planning status, overall health score 1-100 with top 3 priorities). Should flag the SEP-IRA
  -> 401(k) rollover opportunity to clean the pro-rata path, the life insurance gap, and NY 529
  deduction considerations.
